# Entrega contínua da Educastore — PGC seções 6 e 9.
# Site estático: o pacote é o código da versão, gerado uma vez e promovido.
#
#   push na main
#     └─ preparar ..... SemVer + zip
#         └─ staging .. pacote candidato
#             └─ producao ... aprovação do Environment production
#                             tag vX.Y.Z + Release (baseline)

name: CD

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  preparar:
    name: Versão e pacote
    runs-on: ubuntu-latest
    outputs:
      versao: ${{ steps.versao.outputs.versao }}
      release: ${{ steps.versao.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calcular próxima versão (Conventional Commits)
        id: versao
        env:
          NOTAS_ARQUIVO: notas-release.md
        run: node scripts/proxima-versao.mjs

      - name: Empacotar o site
        run: |
          mkdir pacote
          git archive HEAD | tar -x -C pacote
          echo "${{ steps.versao.outputs.versao }}" > pacote/VERSAO
          test -d pacote
          nome="${{ github.event.repository.name }}-${{ steps.versao.outputs.versao }}"
          (cd pacote && zip -qr "../$nome.zip" .)
          echo "Pacote gerado: $nome.zip"

      - name: Guardar pacote
        uses: actions/upload-artifact@v7
        with:
          name: pacote
          path: |
            *.zip
            notas-release.md
          retention-days: 30

  staging:
    name: Staging
    needs: preparar
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pacote

      - name: Extrair pacote
        run: mkdir site && unzip -q ./*.zip -d site && test -f site/index.html

      - name: Resumo
        env:
          VERSAO: ${{ needs.preparar.outputs.versao }}
          RELEASE: ${{ needs.preparar.outputs.release }}
        run: |
          {
            echo "## Staging — v$VERSAO"
            echo "Pacote candidato na seção Artifacts."
            if [ "$RELEASE" = "true" ]; then
              echo "Aprove o job Produção para criar a baseline v$VERSAO."
            else
              echo "Sem feat/fix desde a última tag: não haverá release nova."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  producao:
    name: Produção
    needs: [preparar, staging]
    if: needs.preparar.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ needs.preparar.outputs.versao }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: pacote
          path: entrega

      - name: Criar baseline — tag e Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.preparar.outputs.versao }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::notice::Tag $TAG já existe — nada a fazer."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG" "$GITHUB_SHA"
          git push origin "$TAG"
          gh release create "$TAG" entrega/*.zip --title "$TAG" \
            --notes-file entrega/notas-release.md --verify-tag
